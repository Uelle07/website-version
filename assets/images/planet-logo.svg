<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Planet Gradient -->
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#00c2a8" />
      <stop offset="75%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b0764" />
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c2a8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(60, 60) rotate(-22)">
    <!-- Back Ring -->
    <ellipse cx="0" cy="0" rx="52" ry="14" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-linecap="round" opacity="0.5" />

    <!-- Main Planet Sphere -->
    <circle cx="0" cy="0" r="32" fill="url(#planetGrad)" filter="url(#glow)" />

    <!-- Planet Highlight/Atmosphere -->
    <circle cx="-10" cy="-10" r="28" fill="#ffffff" opacity="0.12" />

    <!-- Front Ring -->
    <path d="M -52 0 A 52 14 0 0 0 52 0" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />

    <!-- Orbital Accent Stars -->
    <circle cx="-38" cy="-18" r="1.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="42" cy="16" r="2" fill="#c084fc" opacity="0.9" />
  </g>
</svg>
